# ---------------------------------------------------------------------------
# Service Account used by the NGINX pods.
#
# IRSA (IAM Roles for Service Accounts):
#   The annotation below binds this Kubernetes ServiceAccount to an AWS IAM
#   role. Any pod that runs as this SA receives temporary AWS credentials for
#   that role via a projected OIDC token -- NO static AWS keys in the cluster.
#
#   In THIS project the secrets are pulled by GitHub Actions at deploy time, so
#   the nginx pod does not strictly need AWS access. We still wire up IRSA so
#   you can SEE it working (the pod can call `aws sts get-caller-identity` and
#   `aws secretsmanager get-secret-value`). It is also the exact mechanism the
#   CloudWatch agent uses, so understanding it here pays off later.
#
# Replace <AWS_ACCOUNT_ID> with your 12-digit account id. The CI pipeline also
# patches this value automatically (see .github/workflows/deploy.yml), so you
# can leave the placeholder and let the workflow fill it in.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
  namespace: nginx-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/eks-nginx-app-irsa-role
